</style></head><body><div class="wrap"><section id="setup"><div class="card"><h1>Kuizi Kimi & Pedagogji</h1><p class="muted">Bankë e ndërtuar nga 8 PDF-të. Alternativat e shënuara në material janë përdorur si bazë; përgjigjet e pambushura janë plotësuar kur mund të verifikoheshin. Pyetjet e dëmtuara/pa përgjigje të sigurt janë lënë jashtë testit.</p><p><b id="bankInfo"></b></p><div class="grid"><div><label class="title">Kategoria</label><select id="cat"><option value="ALL">Të gjitha</option><option>Kimi</option><option>Pedagogji / legjislacion / gjuhë</option></select></div><div><label class="title">Burimi / PDF</label><select id="src"><option value="ALL">Të gjitha burimet</option></select></div><div><label class="title">Numri i pyetjeve</label><input id="count" type="number" min="1" value="50"></div></div><label class="opt" style="margin-top:12px"><input id="avoid" type="checkbox" checked> Pa përsëritje derisa të mbarojë banka e përzgjedhur</label><div><button id="start" class="primary">Fillo testin</button><button id="all" class="secondary">Të gjitha pyetjet</button><button id="reset" class="danger">Rivendos historikun</button></div><div id="avail" class="muted"></div></div></section><section id="quiz" class="hidden"><div class="topbar"><div class="card"><div class="row"><b id="prog"></b><button id="finish" class="primary">Përfundo testin</button></div><div class="progress"><div id="bar"></div></div></div></div><div id="questions"></div></section><section id="results" class="hidden"><div class="card"><h1>Rezultati</h1><div id="score"></div><button id="new" class="primary">Test i ri</button></div><div class="card"><h2>Rishikimi</h2><div id="review"></div></div></section></div><script>
const BANK=[{"id":"Q0001","category":"Pedagogji / legjislacion / gjuhë","source_label":"portali pyetje joshkencore","source_no":1,"q":"Cila nga alternativat e mëposhtme përshkruan teknikën e cila bën të mundur shqyrtimin e një teme nga këndvështrime të ndryshme dhe nxënësit përshkruajnë, shoqërojnë, analizojnë, zbatojnë dhe argumentojnë kërkesa, të cilat janë në përputhje me nivelet e të nxënit.","options":["Kubimi","Harta e koncepteve","Projekti kërkimor","Ditari dypjesësh"],"answer":0,"answer_status":"material","note":""},{"id":"Q0002","category":"Pedagogji / legjislacion / gjuhë","source_label":"portali pyetje joshkencore","source_no":2,"q":"Sipas taksonomisë së Bloom-it cili është niveli më ulët i domenit konjitiv tё pyetjes që një mësues mund t’i drejtojë nxënësit?","options":["Të kuptuarit","Njohja","Zbatimi","Analiza"],"answer":1,"answer_status":"material","note":""},{"id":"Q0003","category":"Pedagogji / legjislacion / gjuhë","source_label":"portali pyetje joshkencore","source_no":3,"q":"Arta është një mësuese e re. Ajo është e shqetësuar, pasi vëren se nxënësit nuk janë shumë të qartë nga mësimdhënia e saj. Cila nga veprimtaritë e mëposhtme do t’i sigurojë asaj të dhënat për të bërë një analizë të qartë të dobësive që paraqesin nxënësit në lëndën e saj?","options":["Dikutimi me prindërit e nxënësve.","Diskutimi me kolegët e së njëjtës lëndë.","Diskutimi me nxënësit për të kuptuar dobësitë që ato kanë.","Rezultatet e testimit të nxënësve."],"answer":3,"answer_status":"material","note":""},{"id":"Q0004","category":"Pedagogji / legjislacion / gjuhë","source_label":"portali pyetje joshkencore","source_no":4,"q":"Të nxënit ndërveprues është:","options":["Një qasje që synon të aktivizojë të gjitha aspektet vetjake të nxënësve (intelektin, emocionet, imagjinatën, trupin) për një të nxënë tërësor efektiv.","Proces i të nxënit që bazohet në shkëmbimin e informacionit dhe përvojave ndërmjet nxënësve dhe që pasuron të nxënin.","Proces nëpërmjet të cilit nxënësit me nivele të ndryshme arritjeje punojnë së bashku në grupe të vogla, për një qëllim të përbashkët.","Të nxënit që realizohet gjatë gjithë jetës mbi bazën e njohurive, kompetencave kyçe dhe kualifikimeve, dhe që i zhvillon ato më tej për qëllime vetjake, profesionale dhe shoqërore."],"answer":3,"answer_status":"material","note":""},{"id":"Q0005","category":"Pedagogji / legjislacion / gjuhë","source_label":"portali pyetje joshkencore","source_no":5,"q":"Bazuar në udhëzimin për vlerësimin e nxënësve në sistemin arsimor parauniversitar, cila nga alternativat e mëposhtme NUK është e saktë?","options":["Për klasat 4-12 vlerësimi përfundimtar realizohet me notë, në përfundim të vitit shkollor.","Nota vjetore e vlerësimit të vazhduar (NVv) përcaktohet duke u bazuar në tri notat e vlerësimit të vazhduar të periudhave, duke gjykuar në mënyrë progresive.","Nota vjetore e vlerësimit me detyrë përmbledhëse (Dp) përcaktohet duke u bazuar në tri notat e vlerësimit të detyrës përmbledhëse të periudhave, duke gjykuar në mënyrë progresive.","Nota e vlerësimit të projektit (NVp) përcaktohet në përfundim të projektit duke u bazuar në procesin e realizimit të projektit dhe në produktin përfundimtar, duke marrë në konsideratë vlerësimin me notë të bërë në secilën periudhë."],"answer":2,"answer_status":"material","note":""},{"id":"Q0006","category":"Pedagogji / legjislacion / gjuhë","source_label":"portali pyetje joshkencore","source_no":6,"q":"Mësuesi ka planifikuar një vizitë me nxënësit në bibliotekën e qytetit. Çfarë është më efektive të bëjë mësuesi, në mënyrë që edhe Joni, një fëmijë që lëviz me anë të karrocës, ta vizitojë bibliotekën?","options":["Mësuesja i kërkon një mësuesi tjetër për ta shoqëruar Jonin në këtë vizitë.","Mësuesja shkon më parë në bibliotekë dhe evidenton problemet me të cilat mund të ndeshet nxënësi i saj dhe bën një planifikim paraprak.","Mësuesja i kërkon Jonit të vijë i shoqëruar me një pjesëtar të familjes, i cili do ta shoqërojë atë.","Mësuesja e inkurajon dhe i kërkon Jonit të qëndrojë në shtëpi ditën e vizitës."],"answer":1,"answer_status":"material","note":""},{"id":"Q0007","category":"Pedagogji / legjislacion / gjuhë","source_label":"portali pyetje joshkencore","source_no":7,"q":"Për fëmijët me aftësi të kufizuara në klasat e zakonshme, mësuesi ndihmës bën vlerësimin sipas niveleve të arritjeve të fushave të zhvillimit të përcaktuara në PEI. Ky vlerësim duhet bërë në bashkëpunim:","options":["me drejtuesin e institucionit arsimor dhe specialistë të patologjisë/ve që shfaq fëmija.","me mësuesin e lëndës dhe shërbimin psiko-social të institucionit arsimor.","me prindin dhe kujdestarët që kujdesen për fëmijën.","me komisionin multidisiplinar të ngritur pranë ZVAP-së."],"answer":1,"answer_status":"material","note":""},{"id":"Q0008","category":"Pedagogji / legjislacion / gjuhë","source_label":"portali pyetje joshkencore","source_no":8,"q":"Cila nga alternativat e mëposhtme është shkruar saktë?","options":["klasat 9-ta të shkollës","klasat e 9 të shkollës","klasat e 9-ta të shkollës","klasat e 9-të të shkollës"],"answer":2,"answer_status":"material","note":""},{"id":"Q0009","category":"Pedagogji / legjislacion / gjuhë","source_label":"portali pyetje joshkencore","source_no":9,"q":"Qarkoni alternativën ku fjala është shkruar saktë.","options":["Institucjon arsimor","Institucionë arsimorë","Institucion arsimor","Institucijon arsimor"],"answer":2,"answer_status":"material","note":""},{"id":"Q0010","category":"Pedagogji / legjislacion / gjuhë","source_label":"portali pyetje joshkencore","source_no":10,"q":"Cili nga pohimet e mëposhtëm nuk është i vërtetë në lidhje me testin/detyrën përmbledhëse:","options":["Mësuesi duhet të ruajë deri në përfundim të vitit shkollor testet ose detyrat përmbledhëse.","Koha e realizimit të testit ose detyrës përmbledhëse është 45 minuta.","Testi/detyra përmbledhëse domosdoshmërisht realizohet në fund të periudhës.","Në momentin kur mësuesi vlerëson testet/detyrat përmbledhëse, i vendos notat në regjistër."],"answer":2,"answer_status":"material","note":""},{"id":"Q0011","category":"Pedagogji / legjislacion / gjuhë","source_label":"portali pyetje joshkencore","source_no":11,"q":"Teknika ______________ është një teknikë, e cila u kërkon nxënësve të mendojnë rreth një çështjeje dhe të diskutojnë rreth saj me synim ndërtimin e njohurive të reja. Kjo teknikë siguron një mjedis të lirë dhe të hapur, që inkurajon të gjithë pjesëmarrësit për të shprehur në mënyrë kreative mendimet e tyre rreth një problemi.","options":["Brainstorming","Harta e koncepteve","Projekti kërkimor","Debati"],"answer":0,"answer_status":"material","note":""},{"id":"Q0012","category":"Pedagogji / legjislacion / gjuhë","source_label":"portali pyetje joshkencore","source_no":12,"q":"Strategjitë, metodat dhe teknikat mësimore janë:","options":["një grup sjelljesh dhe qëndrimesh që ndikojnë në mënyrën se si nxënësit mësojnë dhe bashkëveprojnë me mësuesit dhe me shokët e tyre","procedura standarde didaktike, të cilat përdoren nga ana e mësuesve në bashkëpunim me nxënësit, për prezantimin dhe zhvillimin e veprimtarive mësimore, me qëllim përmbushjen e rezultateve të të nxënit","situata dhe procese jetësore që sigurojnë kushtet dhe mjedisin për nxitjen e të mësuarit tek nxënësit","veprimtari të strukturuara mësimore, të qëllimshme që ndodhin jashtë kontekstit të lëndëve dhe fushave të të nxënit."],"answer":1,"answer_status":"material","note":""},{"id":"Q0013","category":"Pedagogji / legjislacion / gjuhë","source_label":"portali pyetje joshkencore","source_no":13,"q":"Duke kontrolluar punën që po zhvillojnë nxënësit në klasë mësuesi vë re se njëri prej nxënësve e ka zgjidhur ushtrimin në mënyrë të gabuar. Hapi i parë që mësuesi duhet të ndërmarrë për të përmirësuar këtë mangësi është:","options":["I jep ushtrime të ngjashme për detyrë shtëpie","Bashkëbisedon me nxënësin dhe ndihmon për gjetjen e gabimit","I thotë nxënësit ta zgjidhë edhe njëherë ushtrimin","I tregon vetëm përgjigjen e saktë të ushtrimit."],"answer":1,"answer_status":"material","note":""},{"id":"Q0014","category":"Pedagogji / legjislacion / gjuhë","source_label":"portali pyetje joshkencore","source_no":14,"q":"Metoda “Di-Dua të Di-Mësova” i ndihmon më shumë nxënësit:","options":["të përzgjedhë një temë aktuale, të përcaktojë qartë të gjitha çështjet për të cilin do të hulumtohet, të përcaktojë produktet finale të projektit si dhe të paraqesë hollësisht çdo fazë të realizimit të projektit.","të aktivizojnë atë që dinë më parë, të bëjnë parashikime mbi atë që do të lexojnë, nëpërmjet pyetjeve që dalin, si dhe të organizojnë atë çfarë kanë mësuar pasi të kenë mbaruar leximin.","të krahasojnë një sërë konceptesh/termash të rëndësishme me cilësi të ndryshme duke nxjerrë të përbashkëtat dhe dallimet mes koncepteve të ndryshme të TIK-ut.","të tregojnë nëpërmjet rubrikës komente qëndrimin dhe vlerësimin e tyre për një ngjashmëritë midis dy koncepteve."],"answer":1,"answer_status":"material","note":""},{"id":"Q0015","category":"Pedagogji / legjislacion / gjuhë","source_label":"portali pyetje joshkencore","source_no":15,"q":"Një mësues dëshiron të prezantojë konceptet e sigurisë në internet për nxënësit. Cila metodë më e avancuar pedagogjike do t'i ndihmojë nxënësit të kuptojnë implikimet praktike të sigurisë në internet?","options":["Të krijojë një skenar interaktiv dhe simulues ku nxënësit luajnë rolin e administratorëve të rrjeteve dhe janë përgjegjës për mbrojtjen e të dhënave të tyre përballë sulmeve të mundshme.","Të ofrojë një prezantim të detajuar dhe teknik mbi protokollet dhe mekanizmat e sigurisë në internet.","Të kërkojë nga nxënësit të hartojnë një ese që eksploron rëndësinë e masave të sigurisë në internet në jetën e përditshme.","Të përdorë materiale vizuale të përgatitura paraprakisht që shpjegojnë konceptet e sigurisë në internet, pa përfshirje të drejtpërdrejtë të nxënësve në diskutime apo aktivitet."],"answer":0,"answer_status":"material","note":""},{"id":"Q0016","category":"Pedagogji / legjislacion / gjuhë","source_label":"portali pyetje joshkencore","source_no":16,"q":"Në një klasë ku ka nxënës me vështirësi në të nxënë, mësuesi:","options":["vendos të njëjtat rezultate të nxëni për të gjithë nxënësit e klasës, por realizon punë tëdiferencuar me nxënës të ndryshëm","përqendron punën dhe fokusohet vetëm te nxënësit me nivel më të ulët arritjesh","vendos rezultate të nxëni të ndryshme për nxënës të ndryshëm","përqendron punën dhe fokusohet vetëm te nxënësit me nivel të lartë arritjesh."],"answer":2,"answer_status":"material","note":""},{"id":"Q0017","category":"Pedagogji / legjislacion / gjuhë","source_label":"portali pyetje joshkencore","source_no":17,"q":"Procesi i gjithëpërfshirjes fillon me:","options":["nxitjen e diferencave mes nxënësve.","njohjen dhe pranimin e diferencave mes nxënësve.","zhvillimin e të drejtave të nxënësve.","thellimin e diferencave mes nxënësve."],"answer":1,"answer_status":"material","note":""},{"id":"Q0018","category":"Pedagogji / legjislacion / gjuhë","source_label":"portali pyetje joshkencore","source_no":18,"q":"Cila nga alternativat e mëposhtme është shkruar saktë?","options":["Procedurat për zbatimin e kurrikulës me zgjedhje përcaktohen me udhëzim të ministrit.","Proçedurat për zbatimin e kurrikulës me zgjedhje përcaktohen me udhëzim të ministrit.","Procedurat për zbatimin e kurrikulës me zgjedhje përcaktohen me udhëzim të Ministrit.","Proçedurat për zbatimin e kurrikulës me zgjedhje përcaktohen me Udhëzim të Ministrit"],"answer":0,"answer_status":"material","note":""},{"id":"Q0019","category":"Pedagogji / legjislacion / gjuhë","source_label":"portali pyetje joshkencore","source_no":19,"q":"Cila nga alternativat e mëposhtme është shkruar saktë?","options":["Portofoli professional i mësuesit","Portofoli profesjonal i mësuesit","Portofoli profesional i mësuesit","Portofoli profesijonal i mësuesit"],"answer":2,"answer_status":"material","note":""},{"id":"Q0020","category":"Pedagogji / legjislacion / gjuhë","source_label":"portali pyetje joshkencore","source_no":20,"q":"Kurrikula në bazë shkolle synon kryesisht:","options":["të unifikojë arsimin në nivel kombëtar.","të vendosë kritere për të matur arritjet e nxënësve në nivel vendor.","t’u ofrojë nxënësve mundësinë për të përfituar përvoja të reja arsimore.","të pajisë nxënësit me aftësitë e nevojshme për punësim në nivel vendor."],"answer":2,"answer_status":"material","note":""},{"id":"Q0021","category":"Pedagogji / legjislacion / gjuhë","source_label":"portali pyetje joshkencore","source_no":21,"q":"Lidhur me kompetencën e mësuesit për të zotëruar përmbajtjen e materialit mësimor, ka më shumë nevojë për trajnim mësuesi që:","options":["mbështetet tek teksti mësimor dhe udhëzuesi i mësuesit për të zhvilluar mësimin.","është në dijeni të zhvillimeve dhe të materialeve të reja që lidhen me lëndën.","paraqet gjithnjë informacion të besueshëm dhe që lidhet me lëndën dhe me temën konkrete që trajton.","asnjë nga të mësipërmet."],"answer":1,"answer_status":"material","note":""},{"id":"Q0022","category":"Pedagogji / legjislacion / gjuhë","source_label":"portali pyetje joshkencore","source_no":22,"q":"Për të shmangur konfliktet ndërmjet mësuesve dhe nxënësve në fushën e vlerësimit mësuesi duhet:","options":["të bindë nxënësit në drejtësinë e vendimit të tij.","të mos lejojë diskutime me nxënësit për notën e vënë.","të bëjë të qarta që në fillim kriteret e vlerësimit të nxënësve.","të rishikojë vendimin e tij."],"answer":2,"answer_status":"material","note":""},{"id":"Q0023","category":"Pedagogji / legjislacion / gjuhë","source_label":"portali pyetje joshkencore","source_no":24,"q":"Cila nga alternativat e mëposhtme është shkruar saktë?","options":["Këshilli Kombëtar i Prindërve","këshilli kombëtar i prindërve","Këshilli kombëtar i prindërve","Këshilli Kombëtar i prindërve"],"answer":0,"answer_status":"material","note":""},{"id":"Q0024","category":"Pedagogji / legjislacion / gjuhë","source_label":"portali pyetje joshkencore","source_no":2 e përmbajtjes së medias dhe të përdorimit të saj.","sigurimin me cilësi dhe rendiment të informacionit.","vlerësimi kritik i informacionit dhe i burimeve të tij."],"answer":0,"answer_status":"material","note":""},{"id":"Q0042","category":"Pedagogji / legjislacion / gjuhë","source_label":"portali pyetje joshkencore","source_no":47,"q":"Ju, si mësues keni vendosur të përdorni median në një orë mësimore për të rritur vetëdijen e nxënësve tuaj, jo vetëm për mundësitë që ofron media në fushën e edukimit, por edhe për rreziqet që bart. Shkruani 3 objektiva të mësuari (pritshmëri në tri nivele arritjeje) që ju synoni të arrini përmes një orë mësimore. Për të shmangur konfliktet ndërmjet mësuesve dhe nxënësve në fushën e vlerësimit mësuesi duhet:","options":["të bindë nxënësit në drejtësinë e vendimit të tij.","të mos lejojë diskutime me nxënësit për notën e vënë.","të bëjë të qarta që në fillim kriteret e vlerësimit të nxënësve.","të rishikojë vendimin e tij."],"answer":2,"answer_status":"material","note":""},{"id":"Q0043","category":"Pedagogji / legjislacion / gjuhë","source_label":"portali pyetje joshkencore","source_no":48,"q":"Për të parandaluar ose për të pakësuar në mënyrë të efektshme paragjykimet në klasën e tyre, mësuesit:","options":["duhet të jenë model i sjelljeve dhe qëndrimeve pa paragjykime.","duhet t’i kushtojnë për një kohë të caktuar trajtimit të çështjeve të pakicave.","duhet të dënojnë fëmijët që shfaqin paragjykime .","duhet të shpërfillin si të parëndësishme shprehjet njëanshmërive në klasë."],"answer":0,"answer_status":"verified_fill","note":"Përgjigje e verifikuar pedagogjikisht."},{"id":"Q0044","category":"Pedagogji / legjislacion / gjuhë","source_label":"portali pyetje joshkencore","source_no":49,"q":"Në një klasë ku ka nxënës me vështirësi në të nxënë, mësuesi: e paragjykimeve dhe të","options":["vendos të njëjtat rezultate të nxëni për të gjithë nxënësit e klasës, por realizon punë të diferencuar me nxënës të ndryshëm.","përqendron punën dhe fokusohet vetëm te nxënësit me nivel më të ulët arritjesh.","vendos rezultate të nxëni të ndryshme për nxënës të ndryshëm.","përqendron punën dhe fokusohet vetëm te nxënësit me nivel të lartë arritjesh."],"answer":2,"answer_status":"material","note":""},{"id":"Q0045","category":"Pedagogji / legjislacion / gjuhë","source_label":"portali pyetje joshkencore","source_no":50,"q":"Cila nga alternativat e mëposhtme është shkruar saktë?","options":["viti 11-të i shkollës","viti i 11 i shkollës","viti i 11-t i shkollës","viti i 11-të i shkollës 51."],"answer":3,"answer_status":"material","note":""},{"id":"Q0046","category":"Pedagogji / legjislacion / gjuhë","source_label":"portali pyetje joshkencore","source_no":53,"q":"Cila nga teknikat e mëposhtme zhvillon aftësinë e nxënësve për të identifikuar shkaqet dhe pasojat e një problemi?","options":["Diagrami i Venit","Leximi i drejtuar","Pema e problemit","Rrjeti i diskutimit"],"answer":2,"answer_status":"material","note":""},{"id":"Q0047","category":"Pedagogji / legjislacion / gjuhë","source_label":"portali pyetje joshkencore","source_no":54,"q":"Cila nga teknikat e mëposhtme është më efektive në zhvillimin e aftësive të nxënësve për të analizuar dhe për të kategorizuar informacione të ndryshme?","options":["Diagrami i Venit","Harta e konceptit","Harta e mendjes","Stuhi mendimi"],"answer":1,"answer_status":"material","note":""},{"id":"Q0048","category":"Pedagogji / legjislacion / gjuhë","source_label":"portali pyetje joshkencore","source_no":55,"q":"Cila nga alternativat e mëposhtme NUK është rubrikë e planit të periudhës?","options":["Burimet e të nxënit","Integrimi i lëndës me lëndët e tjera","Tema mësimore","Vlerësimi i nxënësve"],"answer":3,"answer_status":"material","note":""},{"id":"Q0049","category":"Pedagogji / legjislacion / gjuhë","source_label":"portali pyetje joshkencore","source_no":56,"q":"Cili nga pohimet e mëposhtme është tipar i planifikimit së mësimdhënies që zhvillon kompetenca?","options":["Në planifikim përcaktohet se çfarë do të bëjnë nxënësit gjatë procesit mësimor.","Në planifikim përcaktohet çfarë do të bëjë mësuesi për të realizuar mësimin.","Në planifikim, roli i mësuesit është kryesisht ligjërues (shpjegon).","Planifikimi i mësimit përqendrohet pothuajse te njohuritë lëndore."],"answer":0,"answer_status":"material","note":""},{"id":"Q0050","category":"Pedagogji / legjislacion / gjuhë","source_label":"portali pyetje joshkencore","source_no":57,"q":"Gjatë orëve të mësimit për zhvillimin e aftësive të të shkruarit, mësuesi jep komente për çdo nxënës lidhur me stilin dhe strukturën e punës me shkrim, para se ata të dorëzojnë versionin final. Ç’ lloj vlerësimi po përdor mësuesi?","options":["Vlerësimi i të nxënit","Vlerësimi për të nxënë","Vlerësimi diagnostikues","Vlerësimi me dosje"],"answer":1,"answer_status":"material","note":""},{"id":"Q0051","category":"Pedagogji / legjislacion / gjuhë","source_label":"portali pyetje joshkencore","source_no":58,"q":"Mësuesi prezanton një temë dhe kërkon që çdo nxënës të shkruajë një fjalim, të cilin do ta prezantojnë para klasës. Cila aftësi e nxënësve po zhvillohet në këtë rast?","options":["Aftësia për të identifikuar temën kryesore në një fjalim","Aftësia për të lexuar me zë të lartë","Aftësia për të organizuar dhe për të prezantuar mendimet në mënyrë të qartë","Aftësia për të përmbledhur tekste joletrare"],"answer":2,"answer_status":"material","note":""},{"id":"Q0052","category":"Pedagogji / legjislacion / gjuhë","source_label":"portali pyetje joshkencore","source_no":59,"q":"Cila nga fjalitë e mëposhtme NUK është shkruar saktë?","options":["Olimpiada zhvillohet sipas procedurave të përcaktuara në një udhëzim të ministrit përgjegjës për arsimin.","Pas këtij njoftimi, drejtori i shkollës bën çregjistrimin e nxënësit.","Të gjithë nxënësit pajisen me certifikatë dhe diplomë të Maturës Shtetërore.","Vlerësimi është proçesi gjatë të cilit mblidhen të dhëna dhe gjykohet për vlerën e arritjes së rezultateve të të nxënit."],"answer":3,"answer_status":"material","note":""},{"id":"Q0053","category":"Pedagogji / legjislacion / gjuhë","source_label":"portali pyetje joshkencore","source_no":60,"q":"Cila nga alternativat e mëposhtme është shkruar saktë?","options":["Mbrojtja dhe përpunimi i të dhënave personale të nxënësve bëhet në përputhje me Ligjin nr. 9887, datë 10.03.2008 “Për mbrojtjen e të dhënave personale”.","Mbrojtja dhe përpunimi i të dhënave personale të nxënësve bëhet në përputhje me ligjin nr. 9887, Datë 10.03.2008 “Për Mbrojtjen e të Dhënave Personale”.","Mbrojtja dhe përpunimi i të dhënave personale të nxënësve bëhet në përputhje me Ligjin Nr. 9887, datë 10.03.2008 “Për Mbrojtjen e të Dhënave Personale”.","Mbrojtja dhe përpunimi i të dhënave personale të nxënësve bëhet në përputhje me ligjin nr. 9887, datë 10.03.2008 “Për mbrojtjen e të dhënave personale”."],"answer":0,"answer_status":"material","note":""},{"id":"Q0054","category":"Pedagogji / legjislacion / gjuhë","source_label":"portali pyetje joshkencore","source_no":65,"q":"Qarkoni alternativën ku fjala është shkruar saktë.","options":["Arësim parauniversitar","Arsimë parauniversitar","Arsim parauniversitar","Arsimim parauniversitar"],"answer":2,"answer_status":"material","note":""},{"id":"Q0055","category":"Pedagogji / legjislacion / gjuhë","source_label":"portali pyetje joshkencore","source_no":66,"q":"Cfarë është inteligjenca emocionale?","options":["Aftësia për të zgjidhur probleme matematikore","Aftësia për të kontrolluar ndjenjat dhe për të kuptuar ndjenjat e të tjerëve","Niveli i njohurive letrare","Aftësia për të memorizuar informacione"],"answer":1,"answer_status":"material","note":""},{"id":"Q0056","category":"Pedagogji / legjislacion / gjuhë","source_label":"portali pyetje joshkencore","source_no":67,"q":"Në çfarë forme zhvillohet komunikimi më efektiv në klasë?","options":["Njëkahëshe – mësuesi flet, nxënësi dëgjon","Vetëm përmes të shkruarës","Ndërveprues dhe i hapur mes palëve","Vetëm përmes prezantimeve"],"answer":2 er_status":"material","note":""},{"id":"Q0084","category":"Pedagogji / legjislacion / gjuhë","source_label":"portali pyetje joshkencore","source_no":94,"q":"Kur përdoret vlerësimi përmbledhës?","options":["Në mes të çdo orë","Pas çdo pyetje","Në fund të një kapitulli ose periudhe","Vetëm për sjelljen"],"answer":2,"answer_status":"material","note":""},{"id":"Q0085","category":"Pedagogji / legjislacion / gjuhë","source_label":"portali pyetje joshkencore","source_no":95,"q":"Cili është roli kryesor i planit të periudhës në strukturën e dokumentacionit mësimor?","options":["Të shënojë mungesat e nxënësve dhe përparimin e tyre.","Të përmbledhë temat mësimore të realizuara dhe vlerësimin përfundimtar.","Të ndajë materialin mësimor në njësi të planifikuara për një periudhë të caktuar kohore me objektiva të qarta.","Të shërbejë si bazë për zhvillimin e aktiviteteve jashtëshkollore."],"answer":2,"answer_status":"material","note":""},{"id":"Q0086","category":"Pedagogji / legjislacion / gjuhë","source_label":"portali pyetje joshkencore","source_no":96,"q":"Sa e rëndësishme është përmbyllja e raportit të periudhës në sistemin elektronik të dokumentacionit shkollor dhe cilat janë pasojat nëse ky nuk plotësohet në kohë?","options":["Nuk është e rëndësishme pasi përdoret vetëm për statistikë.","Është e rëndësishme për mbajtjen e evidencave por nuk ndikon në vlerësimin e nxënësve.","Është e domosdoshme për një pasqyrë të saktë të performancës së nxënësve dhe për planifikimin e mësimit në periudhën në vazhdim; vonesat mund të shkaktojnë humbje të të dhënave dhe probleme në komunikimin me prindërit.","Raporti mund të plotësohet edhe pas përfundimit të vitit shkollor."],"answer":2,"answer_status":"material","note":""},{"id":"Q0087","category":"Pedagogji / legjislacion / gjuhë","source_label":"portali pyetje joshkencore","source_no":97,"q":"Në dokumentacionin e nxënësve, si trajtohet ruajtja dhe mbrojtja e të dhënave personale sipas legjislacionit në fuqi?","options":["Të dhënat ruhen në një dosje të hapur dhe janë të aksesueshme për të gjithë mësuesit.","Të dhënat ruhen vetëm në dosjen fizike dhe nuk ka kërkesa të veçanta për sigurinë.","Të dhënat ruhen në mënyrë të sigurt, në formë fizike ose elektronike, me akses të kufizuar vetëm për personelin e autorizuar dhe në përputhje me ligjin për mbrojtjen e të dhënave personale.","Të dhënat ruhen vetëm për një vit shkollor dhe më pas fshihen."],"answer":2,"answer_status":"material","note":""},{"id":"Q0088","category":"Pedagogji / legjislacion / gjuhë","source_label":"portali pyetje joshkencore","source_no":98,"q":"Cilat janë kriteret që duhet të plotësojë një plan individual i zhvillimit për nxënës me nevoja të veçanta?","options":["Të jetë i përgjithshëm dhe i njëjtë për të gjithë nxënësit me vështirësi.","Të përmbajë objektiva të qarta, të matshme, dhe të përshtatura për aftësitë dhe nevojat e nxënësit në fjalë.","Të jetë fleksibël, i detajuar dhe të parashikojë mënyra dhe mjete për ndihmë të specializuar gjatë mësimit.","Të përqendrohet vetëm në aspektin social të nxënësit."],"answer":2,"answer_status":"material","note":""},{"id":"Q0089","category":"Pedagogji / legjislacion / gjuhë","source_label":"portali pyetje joshkencore","source_no":99,"q":"Si trajtohet në dokumentacionin shkollor vlerësimi i formativ gjatë procesit të të nxënit dhe cilat janë përfitimet e tij për nxënësin?","options":["Vlerësimi formativ bëhet vetëm në fillim të vitit shkollor dhe nuk regjistrohet.","Vlerësimi formativ bëhet gjatë gjithë procesit mësimor, duke ofruar informacione të vazhdueshme për përparimin dhe dobësitë e nxënësit, dhe ndihmon në përshtatjen e metodave mësimore për të përmirësuar të nxënit.","Vlerësimi formativ bazohet vetëm në rezultatet e provimeve finale.","Vlerësimi formativ nuk ka ndikim në notën përfundimtare."],"answer":1,"answer_status":"material","note":""},{"id":"Q0090","category":"Pedagogji / legjislacion / gjuhë","source_label":"portali pyetje joshkencore","source_no":100,"q":"Çfarë roli ka dit bi 35%","mbetet në klasë dhe përsërit vitin shkollor. 50% te oreve te planit mesimor","vlerësohet me shkrim nga mësuesi i lëndës për njohuritë dhe konceptet, në të cilat ka munguar.","vlerësohet me shkrim nga një komision që ngre drejtoria e institucionit arsimor."],"answer":2,"answer_status":"material","note":""},{"id":"Q0851","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":14,"q":"Bazuar në “Rregulloren e funksionimit të institucioneve arsimore parauniversitare në Republikën e Shqipërisë”, një nxënës që ndjek klasën e dhjetë të arsimit të mesëm të lartë, ka munguar 30% të orëve vjetore lëndore. Në një rast të tillë, nxënësi:","options":["Vlerësohet me shkrim nga një komision që ngre drejtoria e institucionit arsimor.","Vlerësohet me shkrim nga mësuesi i lëndës për njohuritë dhe konceptet, në të cilat ka munguar.","Nuk klasifikohet në atë lëndë. Mbi 30% shenohet PK","Mbetet në klasë dhe përsërit vitin shkollor. 30% te oreve te planit mesimor"],"answer":1,"answer_status":"material","note":""},{"id":"Q0852","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":15,"q":"Si shkruhet saktë?","options":["Konventa e të drejyave të njeriut","konventa e të drejtave të njeriut","konventa e të Drejtave të njeriut","Konventa e Të Drejtave të Njeriut"],"answer":0,"answer_status":"material","note":""},{"id":"Q0853","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":16,"q":"Shkolla si qendër komunitare ka:","options":["8 orë","10 orë","12 orë","14 orë"],"answer":1,"answer_status":"material","note":""},{"id":"Q0854","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":17,"q":"Metoda ‘’Kubimi’’ zhvillon te nxënësit aftësitë:","options":["lexuese","shkruese","folëse","hulumtuese"],"answer":3,"answer_status":"material","note":""},{"id":"Q0855","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":18,"q":"Cili është roli i mësuesit në kuadrin e programeve të reja të gjuhëve të huaja?","options":["është ai që organizon dhe programon veprimtaritë mësimore","është ai që vëzhgon mënyrën e të mësuarit të nxënësve","është burimi i vetëm i informacionit faktik","është si një enciklopedi, si një fjalor i gjallë"],"answer":0,"answer_status":"material","note":""},{"id":"Q0856","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":19,"q":"Cila nga alternativat e mëposhtme i përket nivelit të tretë të zotërimit të njohurive, koncepteve, aftësive dhe qëndrimeve:","options":["kupton dhe shpjegon profilet e vërteta dhe profilet e gabuara","krijon blogje për të mbrojtur bashkëmoshatarët","vlerëson vërtetësinë e të dhënave","demostron hapat për t’u mbrojtur në internet"],"answer":3,"answer_status":"material","note":""},{"id":"Q0857","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":20,"q":"Cila është norma e përcaktuar për numrin minimal të nxënësve në një klasë paralele sipas udhëzimit të MASR për vitin shkollor 2024-2025?","options":["10 nxënës","16 nxënës","26 nxënës","30 nxënës"],"answer":2,"answer_status":"material","note":""},{"id":"Q0858","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":21,"q":"cili prej faktorëve më poshtë ndikon drejtpërdrejt në efektivitetin e mësimdhënies aktive?","options":["leximi i mësimit nga libri pa ndërveprim me nxënësit","përdorimi i së njëjtës metodë për të gjithë nxënësit","aktivizimi i nxënësve në diskutime, zgjidhje problemesh dhe punë në grup","qëndrimi i heshtur i nxënësve gjatë gjithë orës"],"answer":2,"answer_status":"material","note":""},{"id":"Q0859","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":22,"q":".Referuar “Standardeve profesionale të formimit të përgjithshëm dhe të formimit lëndor të mësuesit në sistemin arsimor parauniversitar”, përcaktoni cili ndër treguesit e mëposhtëm lidhet me demonstrimin e standardit “Kurrikula dhe zhvillimi i kompetencave kyç”. Mësuesi:","options":["përdor mënyra të larmishme të komunikimit dhe të bashkëpunimit me prindërit dhe komunitetin.","identifikon vazhdimisht nevojat e tij individuale për zhvillimin profesional.","planifikon rezultatet e të nxënit sipas kompetencave të fushës/lëndës.","punon në grupe, në komisione lëndore dhe në përbërje të ekipit të shkollës."],"answer":2,"answer_status":"material","note":""},{"id":"Q0860","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":23,"q":"Referuar Udhëzimit “Për organizimin dhe funksionimin e sistemit të zhvillimit të vazhdueshëm profesional të punonjësve arsimorë”, në çdo takim të rrjetit professional shtjellohet një temë për praktikën e punës së përditshme, e cila:","options":["planifikohet nga drejtuesi i rrjetit në bashkëpunim me drejtuesit e rrjeteve të tjera profesionale.","planifikohet nga drejtuesi i rrjetit në bashkëpunim me anëtarët e tij.","planifikohet nga drejtuesi i ZVAP-së ku bën pjesë rrjeti.","planifikohet në nivel qendror nga specialistë të arsimit."],"answer":1,"answer_status":"material","note":""},{"id":"Q0861","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":24,"q":"Vetëvlerësimi dhe analiza serioze, e detajuar dhe periodike e vetes mbi bazën e standardeve profesionale të formimit të përgjithshëm i jep mësuesit një mundësi të çmuar për të kuptuar në kohë pikat e tij të forta dhe ato të dobëta. Nivelet e arritjeve përmes të cilave mësuesit mund të bëjnë vetëvlerësimin dhe të përcaktojnë arritjen e kompetencës së tyre profesionale janë: 1 pikë","options":["dy.","tre.","katër.","pesë"],"answer":2,"answer_status":"material","note":""},{"id":"Q0862","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":25,"q":"Cilit standard të formimit profesional të arsimit parauniversitar i përket përshkrimi \"Mësuesi demonstron aftësi bashkëpunuese të punës në grup me kolegët e tij, duke treguar që ai nuk është vetëm mësues lëndor, por edhe pjesëtar i një komuniteti profesionistësh që interesohet dhe punon për institucionin në të gjitha aspektet e tij. Mësuesi zotëron njohuri për etikën, parimet e komunikimit, si dhe demonstron aftësi të zbatimit të tyre në sjelljen e tij, si themeli mbi të cilin ndërtohen të gjitha meritat e tjera profesionale”","options":["Përgatitja shkencore","Bashkëpunimi me kolegët dhe komunikimi","Bashkëpunimi me komunitetin.","Vlerësimi I të nxënit"],"answer":1,"answer_status":"material","note":""},{"id":"Q0863","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":28,"q":"Himni Kombetar kendohet nga nxenesit e IA-ve kur:","options":["Cdo dite","Cdo jave","Te henen e pare te cdo muaji para fillimit te mesimit","Te henen e pare te cdo muaji pas fillimit te mesimit"],"answer":0,"answer_status":"material","note":""},{"id":"Q0864","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":30,"q":"Mësuesit e institucioneve arsimore publike qëndrojnë në mjediset e shkollës:","options":["30 orë në javë","35 orë në javë","40 orë në javë","45 orë në javë"],"answer":0,"answer_status":"material","note":""},{"id":"Q0865","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":31,"q":"Jep rekomandimet përkatëse për ndjekjen nga fëmija të një institucioni arsimor të zakonshëm a të specializuar.","options":["Vetem prindi","Vetëm drejtori shkollës","Drejtori dhe prindi","Një komisioni i përbërë nga mjekë, psikologë, mësues dhe specialistë për fëmijët me aftësi të kufizuara"],"answer":0,"answer_status":"material","note":""},{"id":"Q0866","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":32,"q":"Këshilli i mësuesve mblidhet edhe në rastet kur e gjykon të arsyeshme drejtori i institucionit arsimor ose kur e kërkon :","options":["1/5 e anëtarëve të tij","jo më pak se 1/3 e anëtarëve të tij.","1/4 e anëtarëve të tij","1/2 e anëtarëve të tij"],"answer":1,"answer_status":"material","note":""},{"id":"Q0867","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":33,"q":"Numri shkallëve në të cilat është strukturuar korniza kurikulare është:","options":["3","4","5","6"],"answer":0,"answer_status":"material","note":""},{"id":"Q0868","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":36,"q":"Sipas udhëzimit 30, 3 klasa paralele në Arsimin Bazë dhe AML formohen me :","options":["30-59 nxënës ( 2 paralele)","60-99 ( 3)","100-133 (4)","134-167 (5)"],"answer":0,"answer_status":"material","note":""},{"id":"Q0869","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":41,"q":"Këshilli i prindërve të shkollës përbëhet nga: takohet tre here ne vit","options":["3-6 prindër","6-9 prindër (24 KLASA )","6-9 prindër dhe një mësues","9-12 prindër."],"answer":1,"answer_status":"material","note":""},{"id":"Q0870","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":42,"q":"Këshilli i prindërve të klasës përbëhet nga: takohen nje here ne dy muaj","options":["3-5 prindër","6-9 prindër","6-9 prindër dhe një mësues","9-12 prindër."],"answer":0,"answer_status":"material","note":""},{"id":"Q0871","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":43,"q":"Temat ndërkurrikulare janë:","options":["çështje të rëndësishme me të cilat përballet shoqëria tani dhe në të ardhmen dhe që trajtohen në fushat e të nxënit duke krijuar mundësinë që nxënësit të interpretojnë botën dhe të lidhin dijet e marra në shkollë me jetën dhe me interesat e tyre.","një bashkësi lëndësh që kanë qëllime dhe detyra të përbashkëta për formimin e njohurive të reja dhe të kompetencave të nxënësve.","tërësia e dijeve, informacionit, fakteve, situatave, veprimtarive etj., të grupuara në një lëndë ose fushë të nxëni, që shërbejnë si bazë për formimin dhe zhvillimin e njohurive të reja dhe kompetencave kyç.","veprimtari themelore të institucioneve arsimore që sigurojnë krijimin dhe shndërrimin e njohurive, përsosjen e kompetencave gjatë gjithë jetës dhe zhvillimin vetjak."],"answer":0,"answer_status":"material","note":""},{"id":"Q0872","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":44,"q":"Një aspekt i rëndësishëm i punës së mësuesit është komunikimi me të gjithë aktorët e shkollës. Komunikimi mësues-prind është efektiv kur:","options":["prindërit mendojnë se kanë rol primar në edukimin e fëmijëve","prindërit mendojnë se shkolla ka përgjegjësinë kryesore për edukimin e fëmijëve","përgjegjësia qëndron në punën e përbashkët prind-mësues","i lihet rastësisë."],"answer":2,"answer_status":"material","note":""},{"id":"Q0873","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":45,"q":"Cila nga thëniet e mëposhtme përshkruan më mirë “gjithëpërfshirjen”?","options":["Është besimi se nxënësit duhet të veçohen sipas aftësive të tyre.","Është besimi se disa nxënës nuk mund të mësojnë.","Është filozofia që të gjithë nxënësit kanë të drejtë të marrin arsim të barabartë në një sistem arsimor.","Është filozofia që nxënësit me nevoja të veçanta kanë nevojë për shkolla special"],"answer":2,"answer_status":"material","note":""},{"id":"Q0874","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":47,"q":"Në fillim të vitit shkollor, një mësues sheh se në klasën e tij ka nxënës të ardhur nga qytete dhe zona të ndryshme të vendit. Një nga mënyrat më të mira për të studiuar ngjashmëritë dhe dallimet mes kulturave të tyre do të ishte që këta nxënës:","options":["të marrin informacione nga një shumëllojshmëri burimesh për kulturat e tyre dhe t’i paraqesin me një përshkrim të shkurtër në formën e një raporti","të përshkruajnë dhe të krahasojnë kushtet e jetesës së qyteteve apo krahinave nga kanë ardhur","të krijojnë në klasë në orët e projekteve grupe të vogla heterogjene me përkatësi kulturore të ndryshme","të organizojnë një panair në formën e një projekti, ku të gjithë të paraqesin veçoritë e kulturës së zonave nga kanë ardhur (kostume popullore, foto, postera me figura të shquara nga të gjitha fushat, receta gatimi, postera me objektet dhe ndërtesat e rëndësishme të zonës nga kanë ardhur etj.)."],"answer":3,"answer_status":"material","note":""},{"id":"Q0875","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":48,"q":"Për të shmangur konfliktet ndërmjet mësuesve dhe nxënësve në fushën e vlerësimit mësuesi:","options":["duhet të bindë nxënësit në drejtësinë e vendimit të tij","duhet të mos lejojë diskutime me nxënësit për notën e vënë","duhet të bëjë të qarta që në fillim kriteret e vlerësimit të nxënësve","duhet të rishikojë çdo vlerësim që u bën nxënësve."],"answer":2,"answer_status":"material","note":""},{"id":"Q0876","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":49,"q":"Nxënësit e një klase sillen përgjithësisht mirë, me përjashtim të Emit. Emi ngrihet vazhdimisht pa leje nga vendi i saj, lëviz nëpër klasë, shqetëson nxënësit dhe komenton vrazhdë gjatë diskutimeve me shokët dhe shoqet e klasës. Cila është mënyra më e mirë që mësuesi të përmirësojë sjelljen e Emit?","options":["E nxjerr Emin para klasës sa herë që ajo gabon dhe e qorton për sjelljen e saj.","Diskuton me Emin çdo ditë gjatë pushimit të madh dhe e qorton për sjelljen e saj.","Kërkon nga stafi drejtues i shkollës që Emit t’i jepet një masë disiplinore.","Takohet me prindërit e Emit dhe vendosin së bashku se si do të përmirësojnë sjelljen e saj."],"answer":3,"answer_status":"material","note":""},{"id":"Q0877","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":50,"q":"Kohët e fundit, Joni ka filluar të aktivizohet në mësim dhe të përmirësojë arritjet e tij. Megjithatë, ende ndodh që ai nuk u përgjigjet saktë pyetjeve të mësuesit. Cili është reagimi më i mirë i mësuesit në një rast të tillë? *","options":["Kjo përgjigje nuk është e saktë.","Jo! Ti akoma s’je askund!","Ende vazhdon të kesh dobësi.","A mund ta mendosh edhe njëherë përgjigjen?"],"answer":3,"answer_status":"material","note":""},{"id":"Q0878","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":51,"q":"Përfshirja e prindërve në edukim është e rëndësishme sepse:","options":["Ndihmon mësuesit në procesin e edukimit të fëmijëve dhe rregullon klimën në shkollë.","Shmang përgjegjësinë e prindërve për kujdesin që duhet të tregojnë ndaj fëmijëve të tyre","Ndihmon mësuesit në procesin e edukimit të fëmijëve, por nuk rregullon klimën në shkollë.","Strategjia që ata ofrojnë nuk është e dobishme dhe frytdhënëse."],"answer":0,"answer_status":"material","note":""},{"id":"Q0879","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":52,"q":"Mësuesi përpiqet që të ofrojë më të mirën e mundshme profesionale për nxënësit e tij .Kjo do të thotë që mësuesi:","options":["Vetkualifikohet profesionalisht në mënyrë të vazhdueshme","Pranon se është i kufizuar në njohuritë e tij profesionale","Nuk mund të dalë jashtë kornizave që i mundëson realiteti arsimor","Nuk ka detyrim të ofrojë më të mirën e mundshme profesionale"],"answer":0,"answer_status":"material","note":""},{"id":"Q0880","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":53,"q":"Qëllimi I Kodit të Etikës","options":["Të nxisë mësuesin në krijimin e një mjedisi motivues për komunitetin","Të nxisë prindin në krijimin e një mjedisi motivues për komunitetin .","Të nxisë nxënësin në krijimin e një mjedisi motivues për komunitetin","Të nxisë vendimmarrësit në krijimin e një mjedisi motivues për komunitetin"],"answer":0,"answer_status":"material","note":""},{"id":"Q0881","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":54,"q":"Një mësues ka në kujdestari një klasë me nxënës të cilët vijnë nga rajone me kultura të ndryshme. Ai kërkon të përfshijë prindërit e këtyre nxënësve, në mënyrë që edhe ata të kontribuojnë në përmirësimin e të nxënit të fëmijëve të tyre. Cila nga pohimet më poshtë tregon mënyrën më efektive për t’i përfshirë ata?","options":["Mësuesi i telefon ata direkt dhe i pyet nëse ata janë të interesuar të bëjnë një prezantim kulturor të rajonit të tyre.","Mësuesi përgatit për të gjithë prindërit një kopje të materialit mësimor që nxënësit duhet të mësojnë dhe i kërkon atyre të sugjerojnë me shkrim materiale shtesë për të nxënët fëmijëve të tyre.","Mësuesi dërgon një letër në të cilën fton prindërit në një takim për të diskutuar rreth mënyrës se si ata do të donin të përfshiheshin dhe kontribuonin në përmirësimin e të nxënit të fëmijëve të tyre.","Mësuesi i telefonon prindërve me prejardhje të ndryshme kulturore dhe i sugjeron atyre të marrin pjesë në aktivitete të rekomanduara për fëmijët e tyre."],"answer":2,"answer_status":"material","note":""},{"id":"Q0882","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":56,"q":"Për menaxhimin e sjelljes së papërshtatshme të AK mësuesi i klasës:","options":["Përfshihet në zgjidhjen e situatës së bashku me mësuesen ndihmëse.","Menaxhon klasën duke mos u përfshirë në problemet e AK.","Raporton në drejtori për problematikat që i paraqiten në klasë.","Komunikon me prindin e AK për shqetësimin që paraqet fëmija në klasë"],"answer":0,"answer_status":"material","note":""},{"id":"Q0883","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":58,"q":"Cila nga alternativat e mëposhtme është shkruar saktë?","options":["viti 11-të i shkollës","viti i 11 i shkollës","viti i 11-t i shkollës","viti i 11-te i shkollës"],"answer":3,"answer_status":"material","note":""},{"id":"Q0884","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":60,"q":"Cila fjalë është shkruar gabim:","options":["Tarracë","Karrotë","Korrigjoj","Serrë"],"answer":0,"answer_status":"material","note":""},{"id":"Q0885","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":61,"q":"Cila fjalë është shkruar saktë:","options":["Injeksion","Inzheksion","Injekson","Inieksion"],"answer":0,"answer_status":"material","note":""},{"id":"Q0886","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":62,"q":"Rretho alternativën e saktë :","options":["Populli ynë thotë:”Trimi i mirë me shokë shumë. “","Populli ynë thotë”Trimi i mirë me shokë shumë .“","Populli ynë thotë:”trimi i mirë me shokë shumë .“","Populli ynë thotë-”Trimi i mirë me shokë shumë.”"],"answer":0,"answer_status":"material","note":""},{"id":"Q0887","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":63,"q":"Qarkoni alternativën e saktë. Të nxënit me situata NUK i mundëson nxënësit të mësojnë nëpërmjet:","options":["Socializimit","Reflektimit","Vizualizimit","Riprodhimit"],"answer":3,"answer_status":"material","note":""},{"id":"Q0888","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":64,"q":"Vlerësimi formues kryhet:","options":["gjatë gjithë kohës","në fillim të vitit shkollor","në përfundim të një periudhe","në përfundim të një kohe të caktuar"],"answer":0,"answer_status":"material","note":""},{"id":"Q0889","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":65,"q":"Gjergji është një mësues që shpenzon shumë kohë për planifikimin e mësimdhënies dhe e zbaton në mënyrë korrekte atë. Megjithëse planifikimi i detajuar është një pjesë kritike e suksesit të mësimdhënies së tij, cila nga alternativat e mëposhtme përshkruan më mirë se çfarë duhet të bëjë ai për të shmangur efektet negative?","options":["Ai duhet përherë t’i qëndrojë strikt synimeve dhe veprimtarive të planifikuara për çdo mësim.","Ai duhet të lejojë fleksibilitet brenda orës mësimore dhe të marrë parasysh idetë e reja të nxënësve.","Ai duhet të ruajë modelet tradicionale të planifikimit të mësimit dhe të përmbledhë rezultatet në fund të çdo mësimi.","Ai duhet të mos e ndryshojë planifikimin duke reflektuar idetë e reja të nxënësve në mësimet e ardhshme."],"answer":1,"answer_status":"material","note":""},{"id":"Q0890","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":66,"q":"Rezultatet e të nxënit janë udhërrëfyesi kryesor në procesin e planifikimit dhe të realizimit të veprimtarive të të nxënit. Një mësues që harton planin e një periudhe të caktuar, i referohet dhe përzgjedh rezultatet e të nxënit sipas kompetencave kyç apo të lëndës:","options":["nga plani vjetor lëndor","nga programi mësimor përkatës","nga udhëzuesi kurrikular lëndor","nga plani mësimor."],"answer":1,"answer_status":"material","note":""},{"id":"Q0891","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":67,"q":"Në një testim përmbledhës, mësuesi synon të vlerësojë nivelin e arritjeve të nxënësve dhe për këtë ai duhet të hartojë një numër të caktuar pyetjesh në test. Mësuesi e përcakton numrin e pyetjeve dhe pikëve për një koncept, kapitull ose tematikë duke u bazuar:","options":["në peshën specifike që ky koncept, kapitull ose tematikë zë në programin lëndor","në programin orientues të lëndës në provimin kombëtar të arsimit bazë","në tekstin mësimor dhe materialet ndihmëse mësimore","në vështirësinë që kanë hasur nxënësit gjatë zhvillimit të kapitullit."],"answer":0,"answer_status":"material","note":""},{"id":"Q0892","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":68,"q":"Mësuesi ka planifikuar që të zhvillojë një projekt kurrikular me një temë të zgjedhur nga nxënësit. Ai u ka sugjeruar atyre që prezantimin ta realizojnë duke përdorur pajisjet digjitale. Njëri prej grupeve të punës e ka punuar shumë mirë projektin, por nxënësit paraqesin vështirësi në përdorimin e pajisjeve digjitale. Në këtë rast mësuesi:","options":["nuk e quan projektin të përfunduar dhe e vlerëson negativisht","e vlerëson projektin duke u ulur pikët për mosparaqitjen me anë të mjeteve digjitale","i ndihmon nxënësit të përdorin pajisjet digjitale për prezantimin e projektit","u kërkon atyre të përpiqen vetë dhe të bëjnë patjetër prezantimin me pajisje digjitale."],"answer":2,"answer_status":"material","note":""},{"id":"Q0893","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":69,"q":"Një ndër komponentët e procesit të planifikimit është përgatitja e mjedisit fizik të klasës në të cilën do të zhvillohet procesi mësimor. Cilin nga faktorët e mëposhtëm duhet të marrë së pari në konsideratë mësuesi kur planifikon organizimin fizik të klasës?","options":["Shpërndarjen e nxënësve sipas niveleve të arritjeve.","Përmbajtjen e lëndës dhe aftësitë që duhet të zhvillohen te nxënësit.","Llojet e veprimtarive që mësuesi planifikon të zhvillojë.","Nivelin e ndërveprimit shoqëror që mësuesi synon të nxisë."],"answer":2,"answer_status":"material","note":""},{"id":"Q0894","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":71,"q":"I gjithë procesi i të nxënit në fushën e shkencave ka në fokus zhvillimin:","options":["e perdorimit te procedurave shkencore","e kerkimit shkencor","e strategjive te eksplorimit","e komunikimit ne gjuhen e shkences."],"answer":1,"answer_status":"material","note":""},{"id":"Q0895","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":72,"q":"Në _____________ përcaktohet se çfarë duhet të dinë dhe çfarë duhet të jenë në gjendje të bëjnë nxënësit, cilat vlera duhen kultivuar, si duhen aftësuar ata për bashkëjetesë e tolerancë dhe si mund të japin ndihmesë në mënyrë aktive për mirëqenien shoqërore dhe vetjake","options":["mësimdhënie","vlerësim","kurrikulë","standard"],"answer":2,"answer_status":"material","note":""},{"id":"Q0896","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":74,"q":"Vlerësimi për të nxënë:","options":["është koleksionim sistematik i detyrave dhe i punimeve të kryera nga nxënës i për të dëshmuar zhvillimin e kompetencave (njohurive, shkathtësive, qëndrimeve)","ka për qëllim të matë nivelin e arritjeve të nxënësit për një grup të caktuar rezultatesh të nxëni për periudhën përkatëse","mundëson që mësuesi të identifikojë pikat e forta të nxënësve, problemet dhe vështirësitë që ata kanë dhe të japë reagime të menjëhershme, të cilat i ndihmojnë nxënësit të mësojnë më mirë","synon të zbulojë shkaqet e dobësive që kanë nxënësit në fillim të vitit shkollor, në mënyrë që të përcaktojë teknikat korrigjuese. dignostikues"],"answer":2,"answer_status":"material","note":""},{"id":"Q0897","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":75,"q":"Qarkoni alternativën e saktë. Në cilin grup të metodave të mësimdhënies bën pjesë ekskursioni?","options":["Metodat e punës në grup.","Metodat e hulumtimit.","Metodat e mendimit kritik.","Metodat e mendimit krijues"],"answer":1,"answer_status":"material","note":""},{"id":"Q0898","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":77,"q":"Qarkoni alternativën e saktë. Cilit prej niveleve të arritjeve i përket vlerësimi me notën 7- të?","options":["Niveli 1","Niveli 2","Niveli 3","Niveli 4."],"answer":2,"answer_status":"material","note":""},{"id":"Q0899","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":78,"q":".___________________ka të përcaktuar temën, kohëzgjatjen, rezultatet e të nxënit, konceptet kryesore, veprimtaritë kryesore, partnerët, burimet, produktin kryesor dhe kriteret e vlerësimit:","options":["Kurrikula me zgjedhje,","Projekti kurrikular,","Veprimtaria ekstrakurrikulare,","Veprimtaria ndërkurrikulare"],"answer":1,"answer_status":"material","note":""},{"id":"Q0900","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":79,"q":"Qarkoni përgjigjen e saktë. Bazuar në kurrikulën me kompetenca, situata e të nxënit që planifikohet në planin ditor të mësuesit: 1 pikë","options":["është e detyruar të planifikohet në çdo orë mësimi","është pjesë e rezultateve të të nxënit të orës së mësimit","planifikohet vetëm në planin tremujor të periudhës","lidhet me metodologjinë dhe me organizimin e orës së mësimit."],"answer":3,"answer_status":"material","note":""},{"id":"Q0901","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":80,"q":"Qarkoni përgjigjen e saktë. Nxënësit arrijnë të nxënë deri në 90% të rezultateve të të nxënit në klasë nëse: 1 pikë","options":["lexojnë tekstin","dëgjojnë me vëmendje mësuesin","shikojnë figura apo video","krijojnë modele dhe prezantojnë punët e tyre."],"answer":3,"answer_status":"material","note":""},{"id":"Q0902","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":81,"q":"_________ shprehin kritere të njëjtësuara për vlerësimin e njohurive, të shkathtësive dhe qëndrimeve të nxënësve sipas fushave përkatëse.","options":["Nivelet e arritjes,","Kompetencat kyç,","Shkallët e kurrikulës,","Llojet e vlerësimit."],"answer":0,"answer_status":"material","note":""},{"id":"Q0903","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":82,"q":"Qarkoni alternativën e saktë.Diagrami i Venit ” është një teknikë që e nxit nxënësin të:","options":["evidentojë të përbashkëtat dhe dallimet ndërmjet dy koncepteve","mendojë dhe parashikojë rreth asaj që lexon","për të grupuar ide, mendime, tipare, koncepte","shfaqi mendimet dhe idetë e tij"],"answer":0,"answer_status":"material","note":""},{"id":"Q0904","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":83,"q":"Qarkoni alternativën e saktë. Gjatë planifikimit të testit hapi i parë që duhet të kryejë mësuesi është:","options":["lloji i pyetjes","gjatësia e testit","specfikimet e testit","rezultatet e synuara të të nxënit."],"answer":3,"answer_status":"material","note":""},{"id":"Q0905","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":84,"q":"Pyetjet e hapura janë ato pyetje të cilat:","options":["kërkoni një përgjigje \"Po ose Jo\".","kërkon që nxënësit të përputhen me të kundërtat.","kërkojnë një formë të lirë të përgjigjeve.","kërkoni të gjeni fakte në një fragment leximi."],"answer":2,"answer_status":"material","note":""},{"id":"Q0906","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":85,"q":"Bën pjesë në pyetjet subjektive:","options":["pyetja me zëvendësim të fjalëve.","pyetja me alternativa.","pyetja me kombinime.","pyetja e strukturuar."],"answer":3,"answer_status":"material","note":""},{"id":"Q0907","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":87,"q":"Nxënësit e një klase janë në fazat e para të realizimit të një projekti kurrikular. Me ndihmën e mësueses kanë thirrur një ekspert të tematikës për të cilën zhvillohet projekti. Në cilën fazë të realizimit të projektit janë nxënësit ?","options":["prezantimit të produktit përfundimtar të projektit.","mbledhjes së informacionit dhe të dhënave rreth tematikës.","përgatitjes së produktit përfundimtar të projektit.","përcaktimit të tematikës."],"answer":1,"answer_status":"material","note":""},{"id":"Q0908","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":88,"q":"Diagrami i Venit bёn pjesё nё teknikat dhe metodat e:","options":["zhvillimit tё aftësive lexuese","zhvillimit tё aftësive shkruese","zhvillimit tё aftësive folëse","hulumtimit"],"answer":1,"answer_status":"material","note":""},{"id":"Q0909","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":90,"q":"Gjatë hartimit të planifikimit të periudhës në rubrikën “Metodologjia dhe veprimtaritë e nxënësve mësuesi vendos :","options":["Zhvillimin e temave për një periudhë të caktuar","Situatat e të nxënit që mësuesi parashikon të realizojë gjatë periudhës","Parimet e të mësuarit që përdoren gjatë zhvillimit të temave në një periudhë të pacaktuar","Teknikat , metodat që do të përdoren gjatë zhvillimit të këtyre temave në një periudhë të caktuar"],"answer":3,"answer_status":"material","note":""},{"id":"Q0910","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":91,"q":"______________është një metodë e paraqitjes vizuale të një informacioni dhe shërben për lidhjen e koncepteve të një teme mësimore, disa temave apo të një tematike.","options":["VLMD","Pyetje-pergjigje","Harte koncepti(Konceptograma)","Debati"],"answer":0,"answer_status":"material","note":""},{"id":"Q0911","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":92,"q":"Cila është procedura më e mirë për të dhënë komente pas zhvillimit të një testi në klasë?","options":["Kthejini nxënësve fletët e testit dhe thuaju të kërkojnë përgjigjen për secilën pyetje.","Jepuni referencat e faqeve dhe udhëzoni nxënësit të kërkojnë për përgjigjet.","Kthejuni nxënësve fletët e testit dhe shqyrtoni secilën pyetje.","Jepini secilit nxënës një vlerësim me fjalë si \"Ke punuar mirë\" ose \"Përpiqu më shumë herën tjetër\"."],"answer":2,"answer_status":"material","note":""},{"id":"Q0912","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":94,"q":"Mënyra më e mirë për të rritur shanset për edukimin e nxënësve me aftësi të kufizuara për të arritur potencialin e tyre të plotë, është:","options":["fokusimi në dobësitë e këtyre nxënësve","mbajtjen e një pritshmërie të lartë nga nxënës të tillë","mësimin e një sërë aftësish dhe strategjish që këta nxënës mund t`i zbatojnë në një sërë kontekstesh të jetës së përditshme","inkurajimi i këtyre nxënësve për të përcaktuar qëllimet e tyre"],"answer":2,"answer_status":"material","note":""},{"id":"Q0913","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":95,"q":"Stuhi mendimi është një teknikë, e cila përdoret :","options":["për t`i bërë nxënësit të jenë të vëmendshëm gjatë leximit të një teksti","për të nxitur dhe për të përftuar shumë ide për një temë","për të parashikuar rreth asaj që do të ndodhë më tej në histori","për të shkruar një tregim, duke u bazuar në disa terma kyç."],"answer":1,"answer_status":"material","note":""},{"id":"Q0914","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":100,"q":"Rrjeti i diskutimit është një teknikë mësimore, e cila:","options":["bazohet mbi një mjet pamor që shërben për të paraqitur informacione, ide, koncepte, si dhe lidhjet mes tyre në një mënyrë të organizuar.","i nxit nxënësit të lexojnë dhe të parashikojnë rreth brendisë së një teksti.","ndërtohet mbi bazën e një pyetjeje të hapur që pranon si përgjigje pozitive, ashtu edhe përgjigje negative.","përdoret që nxënësit të kujtojnë terma, fakte, njohuri ose ngjarje për një temë ose një grup temash mësimore."],"answer":2,"answer_status":"material","note":""},{"id":"Q0915","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":101,"q":"Cila nga teknikat e mëposhtme është më efektive në zhvillimin e aftësisë së nxënësve për të aktivizuar njohuritë e mëparshme?","options":["Diagrami i Venit","Pema e problemit","Rrjeti i diskutimit","Stuhi mendimi perdoret ne fazen e pare te ores se mesimit për të aktivizuar njohuritë e mëparshme"],"answer":3,"answer_status":"material","note":""},{"id":"Q0916","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":102,"q":"Cili nga pohimet e mëposhtme NUK është tipar i planifikimit të mësimdhënies që zhvillon kompetenca?","options":["Planifikimi i mësimit përqendrohet mbi proceset, veprimtaritë ose situatat e të nxënit.","Në planifikim përcaktohet se çfarë do të bëjnë nxënësit gjatë procesit mësimor.","Në planifikim përcaktohet çfarë do të bëjë mësuesi për të realizuar mësimin.","Planifikimi i mësimit nuk ka gjithmonë të njëjtën metodologji, pasi organizimi varet nga rezultatet e të nxënit të orës mësimore."],"answer":2,"answer_status":"material","note":""},{"id":"Q0917","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":103,"q":"Sipas teorisë së të nxënit konstruktivist: “Detyrë e nxënësit nuk është ta pranojë informacionin në mënyrë pasive, duke imituar formulimet dhe përfundimet e të tjerëve, por, në vend të kësaj, të angazhohet vetë në brendësimin dhe riformimin ose shndërrimin e informacionit nëpërmjet ‘’shqyrtimit aktiv”. Cila nga alternativat e mëposhtme mbështet thelbin e kësaj teorie?","options":["Të nxënit nëpërmjet shpërblimit është më i pëlqyeshëm se të nxënit nëpërmjet ndëshkimit","Të nxënit mbështetet në ndërveprimet e ngrohta miqësore ndërmjet nxënësve dhe mësuesve","Të nxënit përfshin analizën dhe renditjen me kujdes të nevojave dhe sjelljeve të nxënësve","Të nxënit fitohet kur nxënësve u sigurohen shanse për të bashkëpunuar dhe reflektuar mbi të nxënit e tyre"],"answer":3,"answer_status":"material","note":""},{"id":"Q0918","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":104,"q":"Zbatimi i metodologjive mësimore që plotësojnë nevojat e të nxënit efektiv, vë theksin më shumë te:","options":["përfshirja sistematike e nxënësve të talentuar në eksperimente e vëzhgime për njohjen e natyrës","sigurimi i partneritetit mësues-nxënës në procesin e mësimdhënies dhe të të nxënit","shpjegimi i vazhdueshëm i mësuesit për të zhvilluar të kuptuarit maksimal te nxënësit","vlerësimi i detyrave për të motivuar më shumë nxënësit, pa qenë i nevojshëm argumentimi i saj."],"answer":1,"answer_status":"material","note":""},{"id":"Q0919","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":105,"q":"Në kuadër të procesit të mësimdhënies dhe të nxënit, zbatimi i praktikave bashkëbiseduese sjell që mësuesi:","options":["të respektojë më shumë interesat e nxënësit","të jetë më pak tolerant në përkufizimin e proceseve shkencore","të marrë parasysh njohuritë paraprake të nxënësit","të bjerë dakord me nxënësin për mënyrën e vlerësimit"],"answer":2,"answer_status":"material","note":""},{"id":"Q0920","category":"Pedagogji / legjislacion / gjuhë","source_label":"shteste joshkencore","source_no":106,"q":"Gjatë zhvillimit të testit në klasë një mësues gjeti që shumica e nxënësve nuk i janë përgjigjur saktë një pyetjeje konceptuale. Cila nga strategjitë e mëposhtme ndihmon në adresimin më të mirë të problematikës?","options":["Motivimi i nxënësve për të lexuar dhe mësuar më mirë.","Vënia në dijeni e prindërve për të ndihmuar nxënësin gjatë të nxënit në shtëpi.","Përsëritja sërish e shpjegimit të konceptit nga mësuesi.","Përcaktimi i boshllëqeve dhe trajtimi i konceptit në përputhje me kontekstin."],"answer":3,"answer_status":"material","note":""},{"id":"Q0921","category":"Kimi","source_label":"shtesa kimi","source_no":1,"q":"Një atom ka 11 protone dhe 12 neutrone. Ky atom:","options":["ka numër atomik 23","ka masë atomike 11","ka numër atomik 11","është jon negativ"],"answer":2,"answer_status":"visual_material","note":"Përgjigjja e rrethuar në material."},{"id":"Q0922","category":"Kimi","source_label":"shtesa kimi","source_no":2,"q":"Një atom neutral ka 8 elektrone. Sa protone ka ai?","options":["6","8","10","16"],"answer":1,"answer duke ia treguar të gjithë klasës sa mirë është bërë detyra."],"answer":2,"answer_status":"visual_material","note":"Përgjigjja e shënuar në modelin e instrumentit."},{"id":"Q1024","category":"Pedagogji / legjislacion / gjuhë","source_label":"Adobe Scan 4 Apr 2024 (1) (1) – Modeli i instrumentit","source_no":7,"q":"Pyetja “Cilat janë të përbashkëtat dhe të veçantat e këtyre koncepteve/çështjeve?” zhvillon të menduarit:","options":["Riprodhues.","Analizues.","Krahasues.","Vlerësues."],"answer":2,"answer_status":"visual_material","note":"Përgjigjja e shënuar në modelin e instrumentit."},{"id":"Q1025","category":"Pedagogji / legjislacion / gjuhë","source_label":"Adobe Scan 4 Apr 2024 (1) (1) – Modeli i instrumentit","source_no":8,"q":"Një mësuese ka vënë re se nxënësit e një klase janë më të vështirë se të tjerët dhe krijojnë zhurmë. Cila strategji është më efektive për menaxhimin e disiplinës?","options":["T’u bëjë të ditur “privilegjet” që humbasin sa herë bëhet zhurmë.","Të caktojë një nxënës të monitorojë emrat e nxënësve të zhurmshëm.","Të krijojë një sistem shpërblimesh nëse ndihmojnë shokët të mbajnë qetësinë.","Të bashkëbisedojë me nxënësit për të rënë dakord mbi mënyrat dhe kodet që do të përdoren kur rritet zhurma."],"answer":3,"answer_status":"visual_material","note":"Përgjigjja e shënuar në modelin e instrumentit."},{"id":"Q1026","category":"Pedagogji / legjislacion / gjuhë","source_label":"Adobe Scan 4 Apr 2024 (1) (1) – Modeli i instrumentit","source_no":9,"q":"Një mësues ka në kujdestari një klasë me nxënës nga rajone me kultura të ndryshme. Cila mënyrë është më efektive për të përfshirë prindërit në përmirësimin e të nxënit?","options":["T’u telefonojë direkt dhe t’i pyesë nëse janë të interesuar të bëjnë prezantim kulturor.","T’u dërgojë të gjithë prindërve një kopje të materialit mësimor.","T’u dërgojë një letër ku i fton në një takim për të diskutuar rreth mënyrës si mund të kontribuojnë në përmirësimin e të nxënit të fëmijëve.","T’u telefonojë prindërve me prejardhje të ndryshme kulturore dhe t’u sugjerojë aktivitete."],"answer":2,"answer_status":"visual_material","note":"Përgjigjja e shënuar në modelin e instrumentit."},{"id":"Q1027","category":"Pedagogji / legjislacion / gjuhë","source_label":"Adobe Scan 4 Apr 2024 (1) (1) – Modeli i instrumentit","source_no":10,"q":"Gjatë orës së mësimit një nxënës thyen disiplinën. Cila mënyrë është më efektive për trajtimin e situatës?","options":["Ta nxjerrë nga klasa.","Të diskutojë me nxënësin për veprimet e tij.","T’i përmendë anët negative.","T’i flasë në veçanti duke i vënë në dukje më shumë anët e tij pozitive."],"answer":3,"answer_status":"visual_material","note":"Përgjigjja e shënuar në modelin e instrumentit."},{"id":"Q1028","category":"Pedagogji / legjislacion / gjuhë","source_label":"Adobe Scan 4 Apr 2024 (1) (1) – Modeli i instrumentit","source_no":11,"q":"Një mësuese ka publikuar për një dokumentar televiziv informacione rreth një nxënësi pa dijeninë e prindërve. Sipas Kodit të Etikës:","options":["Mësuesi trajton me respekt dhe mirëbesim çdo informacion personal duke e bërë atë publik.","Mësuesi trajton me respekt dhe mirëbesim çdo informacion personal dhe nuk e bën atë publik.","Mësuesi trajton me mirëbesim informacionet e nxënësit.","Mësuesi komunikon me median pavarësisht llojit të informacionit."],"answer":1,"answer_status":"visual_material","note":"Përgjigjja e shënuar në modelin e instrumentit."},{"id":"Q1029","category":"Pedagogji / legjislacion / gjuhë","source_label":"Adobe Scan 4 Apr 2024 (1) (1) – Modeli i instrumentit","source_no":12,"q":"Një mësues, përpara se të fillojë viti shkollor, do të përgatisë një listë të rregullave të sjelljes që duhen zbatuar në klasë. Cila është më thelbësore?","options":["Të parashikojë të gjithë gamën e sjelljeve që priten nga nxënësit.","Të krijojë një sistem shpërblimi për respektimin e rregullave.","Të sigurohet që rregullat në klasë nuk janë në kundërshtim me udhëzimet dhe rregulloret në fuqi.","Të sigurohet që nxënësit të jenë pjesë e procesit të vendimmarrjes në mënyrë që ta ndiejnë përgjegjësinë."],"answer":2,"answer_status":"visual_material","note":"Përgjigjja e shënuar në modelin e instrumentit."}];const $=s=>document.querySelector(s);const S={quiz:[],ans:{}};const KEY='quiz_kimi_pedagogji_seen_v1';
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function seen(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}function save(v){try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function filtered(){let a=BANK;if($('#cat').value!=='ALL')a=a.filter(x=>x.category===$('#cat').value);if($('#src').value!=='ALL')a=a.filter(x=>x.source_label===$('#src').value);return a}
function upd(){let a=filtered();$('#avail').textContent=`Të disponueshme në këtë përzgjedhje: ${a.length} pyetje.`;$('#count').max=a.length;if(+$ ('#count').value>a.length)$('#count').value=a.length}
function init(){$('#bankInfo').textContent=`Banka aktive: ${BANK.length} pyetje.`;let ss=[...new Set(BANK.map(x=>x.source_label))].sort();$('#src').innerHTML='<option value="ALL">Të gjitha burimet</option>'+ss.map(x=>`<option>${esc(x)}</option>`).join('');$('#cat').onchange=upd;$('#src').onchange=upd;upd();}
function start(){let pool=filtered();let n=Math.max(1,Math.min(parseInt($('#count').value)||50,pool.length));let used=new Set(seen());let p=$('#avoid').checked?pool.filter(x=>!used.has(x.id)):pool;if(p.length<n){let ids=new Set(p.map(x=>x.id));p=p.concat(pool.filter(x=>!ids.has(x.id)))}S.quiz=shuffle(p).slice(0,n).map(x=>({...x,ord:shuffle(x.options.map((t,i)=>({t,i})))}));S.ans={};render();$('#setup').classList.add('hidden');$('#results').classList.add('hidden');$('#quiz').classList.remove('hidden');scrollTo(0,0)}
function render(){$('#questions').innerHTML=S.quiz.map((x,i)=>`<div class="card"><div class="meta">${i+1}/${S.quiz.length} · ${esc(x.category)} · ${esc(x.source_label)}${x.source_no?' · nr. '+x.source_no:''}</div><div class="q">${esc(x.q)}</div>${x.ord.map((o,k)=>`<label class="opt"><input type="radio" name="q${i}" data-i="${i}" value="${o.i}"> <b>${String.fromCharCode(65+k)}.</b> ${esc(o.t)}</label>`).join('')}</div>`).join('');document.querySelectorAll('input[type=radio]').forEach(r=>r.onchange=()=>{S.ans[+r.dataset.i]=+r.value;progress()});progress()}
function progress(){let d=Object.keys(S.ans).length,t=S.quiz.length;$('#prog').textContent=`${d}/${t} të përgjigjura`;$('#bar').style.width=(t?100*d/t:0)+'%'}
function finish(){let c=0,w=0,b=0;S.quiz.forEach((x,i)=>{if(!(i in S.ans))b++;else if(S.ans[i]===x.answer)c++;else w++});let pct=Math.round(100*c/S.quiz.length);$('#score').innerHTML=`<div class="score">${c}/${S.quiz.length} — ${pct}%</div><p><span class="pill">Saktë: ${c}</span><span class="pill">Gabim: ${w}</span><span class="pill">Pa përgjigje: ${b}</span></p>`;$('#review').innerHTML=S.quiz.map((x,i)=>{let a=S.ans[i],ok=a===x.answer;let yours=a===undefined?'Pa përgjigje':x.options[a];let st=x.answer_status||'';return `<div class="review ${ok?'good':'bad'}"><div class="meta">${esc(x.source_label)}${x.source_no?' · nr. '+x.source_no:''} · ${esc(st)}</div><b>${i+1}. ${esc(x.q)}</b><div>Përgjigjja jote: <b>${esc(yours)}</b></div>${ok?'':`<div>Përgjigjja e saktë: <b>${esc(x.options[x.answer])}</b></div>`}${x.note?`<div class="note">${esc(x.note)}</div>`:''}</div>`}).join('');let ids=seen();S.quiz.forEach(x=>{if(!ids.includes(x.id))ids.push(x.id)});save(ids);$('#quiz').classList.add('hidden');$('#results').classList.remove('hidden');scrollTo(0,0)}
$('#start').onclick=start;$('#all').onclick=()=>{$('#count').value=filtered().length};$('#reset').onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){};$('#avail').textContent='Historiku u rivendos.';setTimeout(upd,1500)};$('#finish').onclick=finish;$('#new').onclick=()=>{$('#results').classList.add('hidden');$('#setup').classList.remove('hidden');upd();scrollTo(0,0)};document.addEventListener('DOMContentLoaded',init);if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
